name: audit

on:
  schedule:
    # 每周一 03:17 与 RustSec 数据库比对一次依赖漏洞(避开整点高峰)。
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
